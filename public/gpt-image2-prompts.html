<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamForge AI - GPT-Image2 提示词库</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border: #334155;
      --success: #10b981;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
    }
    
    /* 顶部导航 */
    .header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
    }
    
    .back-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    
    .back-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    
    /* 主容器 */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    /* 标题区 */
    .section-header {
      margin-bottom: 2rem;
    }
    
    .section-header h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }
    
    .section-header p {
      color: var(--text-secondary);
    }
    
    /* 分类筛选 */
    .category-filter {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    
    .filter-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.875rem;
      transition: all 0.2s;
    }
    
    .filter-btn:hover, .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    
    /* 模板网格 */
    .template-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
    }
    
    .template-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      cursor: pointer;
    }
    
    .template-card:hover {
      border-color: var(--primary);
      transform: translateY(-4px);
      box-shadow: 0 10px 40px rgba(99, 102, 241, 0.2);
    }
    
    .template-preview {
      width: 100%;
      height: 200px;
      background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 3rem;
    }
    
    .template-info {
      padding: 1rem;
    }
    
    .template-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    
    .template-category {
      font-size: 0.75rem;
      color: var(--primary);
      background: rgba(99, 102, 241, 0.1);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 0.5rem;
    }
    
    .template-desc {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    
    /* 模态框 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 1rem;
    }
    
    .modal-overlay.active {
      display: flex;
    }
    
    .modal {
      background: var(--bg-card);
      border-radius: 16px;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    
    .modal-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
    }
    
    .modal-close {
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
    }
    
    .modal-close:hover {
      color: var(--text-primary);
    }
    
    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      flex: 1;
    }
    
    .prompt-display {
      background: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      color: var(--text-primary);
      white-space: pre-wrap;
      word-break: break-all;
    }
    
    .modal-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 1rem;
    }
    
    .btn {
      flex: 1;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    
    .btn-primary:hover {
      background: var(--primary-hover);
    }
    
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    
    .btn-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    
    /* 使用按钮 */
    .use-btn {
      background: var(--success);
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.875rem;
      margin-top: 1rem;
      width: 100%;
    }
    
    .use-btn:hover {
      opacity: 0.9;
    }
    
    /* 统计信息 */
    .stats {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
      padding: 1rem;
      background: var(--bg-card);
      border-radius: 12px;
    }
    
    .stat-item {
      text-align: center;
    }
    
    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }
    
    .stat-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    
    /* 响应式 */
    @media (max-width: 768px) {
      .template-grid {
        grid-template-columns: 1fr;
      }
      
      .stats {
        flex-direction: column;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <header class="header">
    <a href="/" class="logo">⚡ 梦境AI</a>
    <a href="/" class="back-btn">← 返回主站</a>
  </header>
  
  <!-- 主内容 -->
  <div class="container">
    <!-- 标题 -->
    <div class="section-header">
      <h1>🎨 GPT-Image2 提示词库</h1>
      <p>精选专业模板 · 一键使用</p>
    </div>
    
    <!-- 统计 -->
    <div class="stats">
      <div class="stat-item">
        <div class="stat-value">16</div>
        <div class="stat-label">精选模板</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">8</div>
        <div class="stat-label">分类</div>
      </div>
      <div class="stat-item">
        <div class="stat-value">免费</div>
        <div class="stat-label">永久使用</div>
      </div>
    </div>
    
    <!-- 分类筛选 -->
    <div class="category-filter">
      <button class="filter-btn active" data-category="all">全部</button>
      <button class="filter-btn" data-category="product">电商产品</button>
      <button class="filter-btn" data-category="portrait">人物肖像</button>
      <button class="filter-btn" data-category="landscape">风景建筑</button>
      <button class="filter-btn" data-category="logo">Logo设计</button>
      <button class="filter-btn" data-category="character">角色设计</button>
      <button class="filter-btn" data-category="art">艺术创作</button>
      <button class="filter-btn" data-category="social">社交媒体</button>
      <button class="filter-btn" data-category="marketing">营销海报</button>
    </div>
    
    <!-- 模板网格 -->
    <div class="template-grid" id="templateGrid">
      <!-- 动态生成 -->
    </div>
  </div>
  
  <!-- 提示词详情模态框 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">提示词详情</h3>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="template-category" id="modalCategory">电商产品</div>
        <p style="margin: 1rem 0; color: var(--text-secondary);" id="modalDesc">模板描述</p>
        <div class="prompt-display" id="modalPrompt">提示词内容...</div>
        <button class="use-btn" onclick="usePrompt()">🚀 复制到剪贴板并跳转生成</button>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">关闭</button>
        <button class="btn btn-primary" onclick="copyPrompt()">📋 复制提示词</button>
      </div>
    </div>
  </div>
  
  <script>
    // 模板数据
    const templates = [
      {
        id: 1,
        name: "电商产品图 - 极简白底",
        category: "product",
        categoryLabel: "电商产品",
        description: "适用于电商产品展示，纯白背景，突出产品本身",
        prompt: "Professional product photography, minimalist white background, studio lighting, sharp focus, commercial quality, high-end aesthetic, clean composition, no shadows, isolated on white",
        icon: "📦"
      },
      {
        id: 2,
        name: "电商产品图 - 场景化",
        category: "product",
        categoryLabel: "电商产品",
        description: "产品在实际使用场景中，增强代入感",
        prompt: "Product lifestyle photography, realistic scene setting, natural lighting, candid atmosphere, professional composition, commercial quality, contextual environment, authentic details",
        icon: "🏠"
      },
      {
        id: 3,
        name: "人物肖像 - 商业感",
        category: "portrait",
        categoryLabel: "人物肖像",
        description: "专业商业人像，适合职场、个人品牌",
        prompt: "Professional headshot, business portrait, soft studio lighting, neutral background, confident expression, high-end fashion photography style, sharp focus, natural skin texture",
        icon: "👤"
      },
      {
        id: 4,
        name: "人物肖像 - 艺术感",
        category: "portrait",
        categoryLabel: "人物肖像",
        description: "艺术化人物肖像，创意表达",
        prompt: "Artistic portrait photography, dramatic lighting, creative composition, cinematic mood, bokeh background, professional retouching, editorial quality, unique perspective",
        icon: "🎨"
      },
      {
        id: 5,
        name: "风景建筑 - 城市风光",
        category: "landscape",
        categoryLabel: "风景建筑",
        description: "城市建筑风光，展现现代都市魅力",
        prompt: "Urban architecture photography, cityscape, golden hour lighting, dramatic sky, professional composition, architectural details, urban aesthetic, cinematic quality",
        icon: "🏙️"
      },
      {
        id: 6,
        name: "风景建筑 - 自然风光",
        category: "landscape",
        categoryLabel: "风景建筑",
        description: "自然风光，山峦、湖泊、森林",
        prompt: "Nature landscape photography, majestic mountains, pristine lake, golden hour, dramatic clouds, professional composition, National Geographic style, breathtaking scenery",
        icon: "🏔️"
      },
      {
        id: 7,
        name: "Logo设计 - 简约现代",
        category: "logo",
        categoryLabel: "Logo设计",
        description: "简约现代风格Logo，适用于科技品牌",
        prompt: "Modern minimalist logo design, clean geometric shapes, professional branding, vector art style, flat design, scalable, unique identity, corporate aesthetic, premium quality",
        icon: "⬡"
      },
      {
        id: 8,
        name: "Logo设计 - 复古经典",
        category: "logo",
        categoryLabel: "Logo设计",
        description: "复古风格Logo，适合传统品牌",
        prompt: "Vintage retro logo design, classic typography, emblem style, heritage aesthetic, hand-drawn elements, traditional craftsmanship, timeless appeal, premium branding",
        icon: "🏷️"
      },
      {
        id: 9,
        name: "角色设计 - 卡通风格",
        category: "character",
        categoryLabel: "角色设计",
        description: "可爱卡通角色，适合IP开发",
        prompt: "Cute cartoon character design, kawaii style, vibrant colors, clean lines, sticker art, vector illustration, friendly expression, merchandise ready, appealing to all ages",
        icon: "🎭"
      },
      {
        id: 10,
        name: "角色设计 - 写实风格",
        category: "character",
        categoryLabel: "角色设计",
        description: "写实人物角色，游戏/影视概念设计",
        prompt: "Realistic character design, concept art, detailed features, professional rendering, game art quality, cinematic lighting, highly detailed, portfolio worthy, fantasy aesthetic",
        icon: "⚔️"
      },
      {
        id: 11,
        name: "艺术创作 - 超现实主义",
        category: "art",
        categoryLabel: "艺术创作",
        description: "超现实艺术风格，梦幻 surreal",
        prompt: "Surrealist art, dreamlike composition, impossible geometry, magical realism, professional fine art, museum quality, thought-provoking, conceptual masterpiece, ethereal atmosphere",
        icon: "🌀"
      },
      {
        id: 12,
        name: "艺术创作 - 抽象几何",
        category: "art",
        categoryLabel: "艺术创作",
        description: "抽象几何风格，现代艺术",
        prompt: "Abstract geometric art, modern composition, bold colors, mathematical patterns, contemporary fine art, gallery quality, innovative design, visual rhythm, structured chaos",
        icon: "◆"
      },
      {
        id: 13,
        name: "社交媒体 - Instagram风",
        category: "social",
        categoryLabel: "社交媒体",
        description: "Instagram风格图片，适合社交分享",
        prompt: "Instagram aesthetic photography, trendy composition, warm filters, lifestyle content, social media ready, viral potential, engaging visual, mobile-friendly, influencer style",
        icon: "📱"
      },
      {
        id: 14,
        name: "社交媒体 - TikTok风",
        category: "social",
        categoryLabel: "社交媒体",
        description: "TikTok竖屏风格，短视频封面",
        prompt: "TikTok vertical format, dynamic composition, eye-catching design, short video thumbnail, viral aesthetic, bold text overlay space, trendy elements, youth culture",
        icon: "🎬"
      },
      {
        id: 15,
        name: "营销海报 - 促销活动",
        category: "marketing",
        categoryLabel: "营销海报",
        description: "促销活动海报，吸引眼球",
        prompt: "Promotional poster design, sale announcement, eye-catching layout, commercial graphics, bold typography, high contrast, marketing materials, advertising quality, conversion focused",
        icon: "📣"
      },
      {
        id: 16,
        name: "营销海报 - 品牌故事",
        category: "marketing",
        categoryLabel: "营销海报",
        description: "品牌叙事海报，情感共鸣",
        prompt: "Brand storytelling poster, emotional narrative, cinematic composition, professional marketing, campaign material, brand identity, compelling visual, corporate communications",
        icon: "💼"
      }
    ];
    
    let currentCategory = 'all';
    let currentTemplate = null;
    
    // 初始化
    function init() {
      renderTemplates();
      setupFilters();
    }
    
    // 渲染模板
    function renderTemplates() {
      const grid = document.getElementById('templateGrid');
      const filtered = currentCategory === 'all' 
        ? templates 
        : templates.filter(t => t.category === currentCategory);
      
      grid.innerHTML = filtered.map(template => `
        <div class="template-card" onclick="openModal(${template.id})">
          <div class="template-preview">${template.icon}</div>
          <div class="template-info">
            <span class="template-category">${template.categoryLabel}</span>
            <h3 class="template-name">${template.name}</h3>
            <p class="template-desc">${template.description}</p>
          </div>
        </div>
      `).join('');
    }
    
    // 设置筛选
    function setupFilters() {
      const buttons = document.querySelectorAll('.filter-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentCategory = btn.dataset.category;
          renderTemplates();
        });
      });
    }
    
    // 打开模态框
    function openModal(id) {
      currentTemplate = templates.find(t => t.id === id);
      if (!currentTemplate) return;
      
      document.getElementById('modalTitle').textContent = currentTemplate.name;
      document.getElementById('modalCategory').textContent = currentTemplate.categoryLabel;
      document.getElementById('modalDesc').textContent = currentTemplate.description;
      document.getElementById('modalPrompt').textContent = currentTemplate.prompt;
      document.getElementById('modalOverlay').classList.add('active');
    }
    
    // 关闭模态框
    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      currentTemplate = null;
    }
    
    // 复制提示词
    function copyPrompt() {
      if (!currentTemplate) return;
      
      navigator.clipboard.writeText(currentTemplate.prompt).then(() => {
        const btn = event.target;
        const original = btn.textContent;
        btn.textContent = '✓ 已复制!';
        setTimeout(() => btn.textContent = original, 2000);
      });
    }
    
    // 使用提示词
    function usePrompt() {
      if (!currentTemplate) return;
      
      // 复制到剪贴板
      navigator.clipboard.writeText(currentTemplate.prompt).then(() => {
        // 跳转到主站并显示提示
        window.open('/', '_blank');
        
        // 可以添加localStorage标记，让主站检测到用户刚从提示词库来
        localStorage.setItem('dreamforge_source', 'prompt-library');
        localStorage.setItem('dreamforge_prompt', currentTemplate.prompt);
      });
    }
    
    // 点击遮罩关闭
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
    
    // ESC关闭
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
    
    // 启动
    init();
  </script>
</body>
</html>
